name: Build and Release .deb

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-python python3-all python3-setuptools fakeroot dpkg-dev

      - name: Build .deb for ${{ matrix.arch }}
        run: |
          sed -i "s/^Architecture:.*/Architecture: ${{ matrix.arch }}/" debian/control
          dpkg-buildpackage -us -uc -b -a${{ matrix.arch }} -rfakeroot

      - name: Collect .deb
        run: |
          mkdir -p dist
          cp ../*.deb dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-text-ocr-${{ matrix.arch }}
          path: dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: live-text-ocr-*
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
